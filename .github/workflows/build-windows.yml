name: Build Windows installer

# Keep a fresh Windows .exe published as a rolling "latest" release, so the landing
# page's Download button (which points at /releases/latest) always hands out the newest
# build. Runs on every push to main, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# The default GITHUB_TOKEN needs write access to move the tag and create/refresh the release.
permissions:
  contents: write

# One build at a time; a newer push cancels an in-flight one so "latest" never goes backwards.
concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+: `npm test` passes a glob to `node --test`, which Node 20 treats as a
      # literal path (and Node 20 is past EOL). Keep this on the same major as dev machines.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Don't ship a broken "latest": gate the build on the same checks we run locally.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Static renderer + compiled main process, then the NSIS installer into release/.
      # `--publish never`: we attach the artifact ourselves (below), not via electron-builder.
      - run: npm run build

      # Every build gets its own number (ADR 0064) — `0.1.<run>`, monotonic across runs — so the
      # app can ask whether a published build is *newer* rather than merely different. Must land
      # before electron-builder, which reads the version from package.json for the installer name
      # and for the `app.getVersion()` the update check compares against. The working tree is
      # never committed; the stamp lives only in this run's artifact and the release body.
      - name: Stamp this build's number into the version
        id: version
        shell: bash
        run: echo "version=$(node scripts/stamp-version.mjs "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

      - run: npx electron-builder --publish never

      # Point the rolling tag at this commit so the published release isn't stale.
      - name: Move "latest" tag to this commit
        shell: bash
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build ${{ steps.version.outputs.version }}
          # The `version:` line is machine-read by the app's update check (electron/update-check.ts):
          # the tag is the rolling `latest` and can't carry a version, so the body announces it.
          body: |
            Automated build of ${{ github.sha }} (${{ github.ref_name }}).
            version: ${{ steps.version.outputs.version }}
          files: release/*.exe
          make_latest: true
          fail_on_unmatched_files: true
