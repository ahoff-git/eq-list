name: Build Windows installer

# Keep a fresh Windows .exe published as a rolling "latest" release, so the landing
# page's Download button (which points at /releases/latest) always hands out the newest
# build. Runs on every push to main, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# The default GITHUB_TOKEN needs write access to move the tag and create/refresh the release.
permissions:
  contents: write

# One build at a time; a newer push cancels an in-flight one so "latest" never goes backwards.
concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+: `npm test` passes a glob to `node --test`, which Node 20 treats as a
      # literal path (and Node 20 is past EOL). Keep this on the same major as dev machines.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Packaging pulls the Electron zip and the NSIS/winCodeSign tooling from github.com release
      # downloads (~120 MB, a handful of requests). Those endpoints 504 now and then, and a build
      # that needs the network for them is hostage to it — so keep them between runs. Both are
      # versioned by what package-lock.json pins (electron, electron-builder), hence the key. This
      # step precedes `npm ci` because electron's own postinstall fetches the same zip.
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-tools-${{ runner.os }}-

      - run: npm ci

      # Don't ship a broken "latest": gate the build on the same checks we run locally.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Static renderer + compiled main process, then the NSIS installer into release/.
      # `--publish never`: we attach the artifacts ourselves (below), not via electron-builder. The
      # `publish` block in package.json still makes electron-builder write `latest.yml` and the
      # `.blockmap` locally — electron-updater's update feed — even though nothing is uploaded here.
      - run: npm run build

      # Every build gets its own number (ADR 0064) — `0.1.<run>`, monotonic across runs — so the
      # app can ask whether a published build is *newer* rather than merely different. Must land
      # before electron-builder, which reads the version from package.json for the installer name
      # and for the `app.getVersion()` the update check compares against. The working tree is
      # never committed; the stamp lives only in this run's artifact and the release body.
      - name: Stamp this build's number into the version
        id: version
        shell: bash
        run: echo "version=$(node scripts/stamp-version.mjs "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"

      # `npm test` just left better-sqlite3 built for plain Node (its own `pretest` hook, since the
      # compiled test suite runs under `node --test`) — packaging it as-is would ship a binary that
      # segfaults the moment the app tries to load it (ADR 0232). `npm run dist`'s own `predist` hook
      # would normally catch this, but CI calls electron-builder directly (for `--publish never`), so
      # the fetch has to happen here instead, right before packaging.
      - run: npm run rebuild:electron

      # On a cold cache electron-builder still downloads the Electron zip and NSIS tooling from
      # github.com, which occasionally 5xx (run 42568505883: 504s on the Electron zip, then on
      # nsis-3.0.4.1.7z, with every check before it green). Retry the packaging rather than fail a
      # good commit over a CDN blip; a genuine packaging error fails all three attempts and still
      # fails the build.
      - name: Package the installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder --publish never && exit 0
            echo "::warning::electron-builder failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      # Point the rolling tag at this commit so the published release isn't stale.
      - name: Move "latest" tag to this commit
        shell: bash
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build ${{ steps.version.outputs.version }}
          # The `version:` line is read by anyone checking the release by hand — electron-updater
          # (electron/auto-update.ts) reads the version from `latest.yml` below instead, the tag is
          # the rolling `latest` and can't carry a version either way, so the body still announces it.
          body: |
            Automated build of ${{ github.sha }} (${{ github.ref_name }}).
            version: ${{ steps.version.outputs.version }}
          # latest.yml + the .blockmap are electron-updater's feed: version/filename/sha512 for the
          # installer, and the block map for differential downloads (both from electron-builder's
          # `publish` config in package.json).
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          make_latest: true
          fail_on_unmatched_files: true
